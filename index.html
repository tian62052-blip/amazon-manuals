<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Product Manuals</title>
<style>
  :root{--bg:#fff;--fg:#16181d;--muted:#5c6370;--line:#e3e6ea;--accent:#1a5fd0}
  @media (prefers-color-scheme:dark){
    :root{--bg:#14161a;--fg:#eceef2;--muted:#9aa2ae;--line:#2a2e35;--accent:#5b95f5}
  }
  body{margin:0;padding:28px 18px;background:var(--bg);color:var(--fg);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  main{max-width:480px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  p{color:var(--muted);font-size:14px;margin:0 0 24px}
  ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
  li{border-bottom:1px solid var(--line)}
  li a{display:block;padding:16px 2px;color:var(--accent);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Product Manuals</h1>
  <p>Select your model number (printed on the product label).</p>
  <ul>
    <li><a href="/b03/">Model B03 — User Manual</a></li>
  </ul>
</main>
</body>
</html>
